<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnos 24x24</title>
    <style>
        /* Estilos Góticos Legibles / Dark Mode Suave */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');

        body { 
            /* Fondo gris carbón en lugar de negro puro para no cansar la vista */
            background: #18181b; 
            color: #e4e4e7; 
            font-family: system-ui, -apple-system, sans-serif; /* Fuente limpia para los números */
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        
        h2 {
            font-family: 'Cinzel', serif; /* Fuente gótica solo para títulos */
            font-size: 1.8rem;
            color: #ff6b6b; /* Rojo más brillante y legible */
            font-weight: 700;
            margin-bottom: 10px;
        }

        .cat-decor {
            font-size: 1.5rem;
            margin-bottom: 20px;
            letter-spacing: 15px;
            opacity: 0.9;
        }

        .calendar-container { 
            max-width: 400px; 
            margin: 0 auto; 
            background: #27272a; /* Fondo contenedor un poco más claro que el body */
            border: 1px solid #3f3f46; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); 
            overflow: hidden; 
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 20px; 
            background: #1e1e24; 
            border-bottom: 1px solid #3f3f46;
        }
        
        .header span {
            font-family: 'Cinzel', serif;
            color: #ff6b6b; 
            font-weight: bold; 
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        .header button { 
            background: none; 
            border: none; 
            color: #a1a1aa; 
            font-size: 1.8rem; 
            cursor: pointer; 
            padding: 0 10px; 
            transition: color 0.3s ease;
        }

        .header button:hover {
            color: #ff6b6b;
        }

        .days-row { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            background: #27272a; 
            padding: 12px 0; 
            font-weight: bold; 
            font-size: 0.9rem; 
            color: #a1a1aa; 
            border-bottom: 1px solid #3f3f46;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            padding: 15px; 
            gap: 8px; 
            background: #27272a;
        }

        .day { 
            aspect-ratio: 1; 
            border-radius: 6px; 
            font-size: 1.1rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 500; 
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .day:not(.empty):hover {
            transform: scale(1.08);
            filter: brightness(1.2);
        }

        /* Días de trabajo: Fondo carmesí oscuro, texto rosa claro */
        .work { 
            background: #5c1616; 
            color: #ffcccc; 
            border: 1px solid #8f2424; 
        }

        /* Días de descanso: Fondo violeta oscuro, texto lavanda claro */
        .rest { 
            background: #2c1a4d; 
            color: #e6ccff; 
            border: 1px solid #553399; 
        }

        .empty { 
            background: transparent; 
        }

        .legend { 
            margin-top: 25px; 
            display: flex; 
            justify-content: center; 
            gap: 25px; 
            font-size: 0.95rem; 
            color: #e4e4e7;
        }

        .legend div { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        .box { 
            width: 16px; 
            height: 16px; 
            border-radius: 4px; 
        }
    </style>
</head>
<body>
    <h2>Turnos de Guardia</h2>
    <div class="cat-decor">🐈‍⬛ 🐈‍⬛ 🐈‍⬛</div>
    
    <div class="calendar-container">
        <div class="header">
            <button id="prev">&#8249;</button>
            <span id="month-year"></span>
            <button id="next">&#8250;</button>
        </div>
        <div class="days-row">
            <div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div>
        </div>
        <div class="grid" id="calendar-grid"></div>
    </div>
    
    <div class="legend">
        <div><div class="box work"></div> Trabaja</div>
        <div><div class="box rest"></div> Descansa</div>
    </div>

    <script>
        const grid = document.getElementById('calendar-grid');
        const monthYear = document.getElementById('month-year');
        
        // Inicia en la fecha actual del usuario
        let currentDate = new Date(); 

        // Fecha Ancla INAMOVIBLE para cálculos: 17 de Julio de 2026 (Descanso)
        const anchorDateUTC = Date.UTC(2026, 6, 17);
        const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        function renderCalendar(date) {
            grid.innerHTML = '';
            const year = date.getFullYear();
            const month = date.getMonth();

            monthYear.textContent = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // Ajuste para Lunes como primer día
            let startDay = firstDay === 0 ? 6 : firstDay - 1; 

            for (let i = 0; i < startDay; i++) {
                const empty = document.createElement('div');
                empty.className = 'day empty';
                grid.appendChild(empty);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const targetUTC = Date.UTC(year, month, day);
                const diffDays = Math.floor((targetUTC - anchorDateUTC) / (1000 * 60 * 60 * 24));

                const dayDiv = document.createElement('div');
                dayDiv.textContent = day;

                if (Math.abs(diffDays) % 2 === 0) {
                    dayDiv.className = 'day rest';
                } else {
                    dayDiv.className = 'day work';
                }
                grid.appendChild(dayDiv);
            }
        }

        document.getElementById('prev').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar(currentDate);
        });

        document.getElementById('next').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar(currentDate);
        });

        renderCalendar(currentDate);
    </script>
</body>
</html>
